sample_metadata:
  title: 没有名字的人
  author: Foxfoxbee
  publisher: 北京联合出版公司
  language: zh
  date: '2018-04-30T16:00:00+00:00'
  tags:
  - 悬疑
  - 好书，值得一读
  - 科幻
  - 小说
  - 科幻小说
  - 文学
  - 太好看了。
  - 雁北堂出品，必属精品
  description: '&lt;div&gt; &lt;p&gt;一个叫汪旺旺的少女，因为名字而被人从小笑到大。十五岁那年，父亲离奇去世，她被一群非人怪物盯上！更奇怪的是，他们一直在追问她的名字。亡命奔逃中，七路迷宫、尘封日记、微能力者，一系列“超自然”事件接踵而来……通过父亲的日记，她得知家族血统的历史——原来一切都源自二战时期德国人在西藏寻找到的“神的基因”！然而想解开最后的真相，还需要一把钥匙，那就是汪旺旺真正的名字。&lt;/p&gt;
    &lt;p&gt; &lt;/p&gt;&lt;/div&gt;'
